<!doctype html>
<html lang="en">
  <head>
    <title>SV-Utilities</title>
    <link rel="stylesheet" type="text/css" href="../../resources/style/base.css" />
    <link rel="stylesheet" type="text/css" href="popup.css" />
  </head>

  <body>
    <div id="app">
      <div id="header-buttons-wrapper" class="button-collection">
        <button id="find-login" class="tooltipped" aria-label="Find login page" disabled>
          <svg
            class="icon"
            aria-hidden="true"
            focusable="false"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" />
            <path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />
            <line x1="12" y1="12" x2="19" y2="5" />
            <circle cx="12" cy="12" r="1" />
          </svg>
        </button>
        <button id="open-options" class="tooltipped" aria-label="Open extension options">
          <svg
            class="icon"
            aria-hidden="true"
            focusable="false"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
      <div id="error"></div>
      <div id="properties-wrapper">
        <h2>Node properties</h2>
        <form id="properties-form">
          <fieldset>
            <legend>Version</legend>
            <label>
              <input
                type="radio"
                id="properties-online-mode"
                disabled
                name="radio"
                value="1"
                checked
              />
              Online
            </label>
            <label>
              <input type="radio" id="properties-offline-mode" disabled name="radio" value="0" />
              Offline
            </label>
          </fieldset>
          <div class="properties-search">
            <input type="text" id="properties-id-input" disabled placeholder="Node-id" />
            <button type="submit" disabled value="getProperties">&#x1F50E;&#xFE0E;</button>
          </div>
          <div class="flex-row">
            <input type="hidden" id="current-page-id" value="" />
            <button type="submit" disabled value="getCurrentPage">Current page</button>
            <input type="hidden" id="current-user-id" value="" />
            <button type="submit" disabled value="getCurrentUser">Current user</button>
          </div>
        </form>
      </div>
      <div id="session-params-wrapper">
        <h2>Session parameters</h2>
        <label>
          <input type="checkbox" disabled id="toggle-profiling" />
          ?profiling=true
        </label>
        <label>
          <input type="checkbox" disabled id="toggle-jsdebug" />
          ?jsdebug=true
        </label>
        <label>
          <input type="checkbox" disabled id="toggle-slimrender" />
          ?slimRender=true
        </label>
      </div>
      <div id="cookie-consent-wrapper">
        <h2>Consent cookie</h2>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
