<!doctype html>
<html lang="en" class="markdown-page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../resources/style/base.css" />
    <link rel="stylesheet" href="../../resources/style/markdown.css" />
    <link rel="stylesheet" href="changelog.css" />
    <title>What's new</title>
  </head>

  <body class="markdown-page">
    <main class="markdown-view">
      <header class="view-header">
        <h1 id="page-title">What's new</h1>
        <a id="documentation-link" href="../docs/docs.html">Documentation</a>
      </header>
      <div id="content" class="markdown-content">Loading release notes&hellip;</div>
      <nav id="version-nav" class="hidden">
        <button type="button" id="prev-version" data-tooltip aria-label="Show older release notes">
          &larr; Older
        </button>
        <span id="version-label"></span>
        <button type="button" id="next-version" data-tooltip aria-label="Show newer release notes">
          Newer &rarr;
        </button>
      </nav>
    </main>
    <script type="module" src="changelog.js"></script>
  </body>
</html>
