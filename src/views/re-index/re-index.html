<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../resources/style/base.css" />
    <link rel="stylesheet" href="re-index.css" />
    <title data-i18n="reindex_reindexViewTitle"></title>
  </head>

  <body>
    <div class="reindex-header">
      <h1 data-i18n="reindex_reindexViewTitle"></h1>
    </div>
    <div id="error"></div>

    <div class="controls-panel">
      <span id="current-node-label" data-i18n="reindex_rootNodeId"></span>
      <output
        id="current-node-id"
        aria-labelledby="current-node-label"
        data-i18n="common_loading"
      ></output>
      <div class="input-groups">
        <div class="button-collection">
          <!-- TODO, revise tooltips/labels -->
          <button
            id="start-reindex-btn"
            type="button"
            data-tooltip
            aria-label="Starts a depth-first reindex of the node tree. Will use a finished preview if available."
            data-i18n-aria-label="reindex_startReindexTooltip"
            disabled
          >
            <span data-i18n="reindex_startReindex"></span>
          </button>
          <button
            id="preview-reindex-btn"
            type="button"
            data-tooltip
            aria-label="Generates a preview of the node tree to be reindexed."
            data-i18n-aria-label="reindex_previewTooltip"
            disabled
          >
            <span data-i18n="reindex_preview"></span>
          </button>
          <button
            id="cancel-reindex-btn"
            type="button"
            data-tooltip
            aria-label="Cancels the ongoing reindex or preview operation."
            data-i18n-aria-label="reindex_cancelReindexTooltip"
            disabled
          >
            <span data-i18n="common_cancel"></span>
          </button>
        </div>
        <div class="input-group-inputs">
          <label class="checkbox-setting" for="include-robots-index-false">
            <span data-i18n="reindex_includeRobotsIndexFalse"></span>
            <input type="checkbox" id="include-robots-index-false" />
          </label>
          <label for="reindex-delay-ms">
            <span data-i18n="reindex_delayBetweenIndexCalls"></span>
            <input id="reindex-delay-ms" type="number" min="0" max="60000" step="25" />
          </label>
          <label for="api-delay-ms">
            <span data-i18n="reindex_delayBetweenApiCalls"></span>
            <input id="api-delay-ms" type="number" min="0" max="60000" step="25" />
          </label>
        </div>
      </div>
    </div>

    <dialog
      id="low-delay-warning"
      aria-labelledby="low-delay-title"
      aria-describedby="low-delay-message"
    >
      <h2 id="low-delay-title"></h2>
      <p id="low-delay-message"></p>
      <form method="dialog">
        <button type="submit" value="ok"></button>
        <button type="submit" value="cancel" autofocus></button>
      </form>
    </dialog>

    <div id="status-wrapper">
      <span class="badge badge-idle" data-i18n="common_statusIdle"></span>
      <span id="summary-text" data-i18n="reindex_readyToReindex"></span>
    </div>
    <div id="spinner" class="bar hidden"></div>

    <div id="log-wrapper">
      <pre id="log-container" class="log-container" role="log" aria-live="polite"></pre>
    </div>

    <script type="module" src="re-index.js"></script>
  </body>
</html>
