<!doctype html>
<html>
  <head>
    <title>Options</title>
    <link rel="stylesheet" href="../../resources/style/base.css" />
    <link rel="stylesheet" type="text/css" href="options.css" />
    <link id="json-theme" href="../../resources/style/json-themes/default.css" rel="stylesheet" />
  </head>

  <body>
    <div id="error"></div>
    <div id="login-paths-wrapper">
      <h2>Find login page</h2>
      <div>
        <label for="custom-login-paths">
          Custom candidate paths (one per line or comma-separated):
        </label>
        <textarea
          id="custom-login-paths"
          rows="4"
          placeholder="/login&#10;/system/login"
        ></textarea>
      </div>
    </div>
    <div id="properties-wrapper">
      <h2>Node properties</h2>
      <label data-tooltip="Enables colors and clickable nodes">
        <input type="checkbox" id="use-syntax-highlighting" aria-describedby="syntax-desc" />
        <span>Rich JSON view</span>
        <span id="syntax-desc" class="sr-only">
          Enables syntax highlighting and clickable node traversal in the properties view.
        </span>
      </label>
      <div>
        <label for="theme-dropdown">JSON theme:</label>
        <select name="Theme" id="theme-dropdown">
          <option value="">Default</option>
        </select>
      </div>
      <div>
        <details id="expandable">
          <summary>Theme preview</summary>
          <div class="json-holder">
            <pre></pre>
          </div>
        </details>
      </div>
    </div>
    <div id="session-params-wrapper">
      <h2>Session parameters</h2>
      <label data-tooltip aria-label="test">
        <input type="checkbox" id="reload-on-change" />
        <span>Reload page on parameter change</span>
      </label>
    </div>
    <div id="save-wrapper">
      <button id="save" disabled>Save</button>
      <pre id="properties"></pre>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
