<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../resources/style/base.css" />
    <link rel="stylesheet" href="find-login.css" />
    <title data-i18n="findLogin_findLoginTitle"></title>
  </head>

  <body>
    <div class="find-login-header">
      <h1 data-i18n="findLogin_findLoginTitle"></h1>
    </div>
    <div id="error"></div>

    <div id="status-wrapper">
      <span class="badge badge-idle"></span>
      <span id="summary-text"></span>
      <a
        id="summary-link"
        href="#"
        class="hidden"
        data-tooltip
        aria-label="Click to copy URL"
        data-i18n-aria-label="findLogin_clickToCopyUrl"
      ></a>
    </div>
    <div id="spinner" class="bar hidden"></div>
    <div id="log-wrapper">
      <pre id="log-container" role="log" aria-live="polite"></pre>
    </div>

    <script type="module" src="find-login.js"></script>
  </body>
</html>
