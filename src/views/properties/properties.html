<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../resources/theme-init.js"></script>
    <link rel="stylesheet" href="../../resources/style/base.css" />
    <link id="json-theme" href="../../resources/style/json-themes/default.css" rel="stylesheet" />
    <link rel="stylesheet" href="properties.css" />
    <title data-i18n="properties_properties"></title>
  </head>

  <body>
    <div id="header-wrapper" class="properties-header">
      <h1 data-i18n="properties_properties"></h1>
      <fieldset
        id="endpoint-selector"
        aria-label="REST endpoint"
        data-i18n-aria-label="properties_restEndpoint"
      >
        <legend data-i18n="properties_restEndpoint"></legend>
      </fieldset>
      <div class="button-collection">
        <button
          data-tooltip
          type="button"
          aria-label="Previous node"
          data-i18n-aria-label="properties_previousNode"
          id="back"
        >
          <span class="icon icon--arrow-left" aria-hidden="true"></span>
        </button>

        <button
          data-tooltip
          type="button"
          aria-label="Next node"
          data-i18n-aria-label="properties_nextNode"
          id="forward"
        >
          <span class="icon icon--arrow-right" aria-hidden="true"></span>
        </button>

        <button
          data-tooltip
          type="button"
          id="copy"
          aria-label="Copy properties to clipboard"
          data-i18n-aria-label="properties_copyProperties"
        >
          <span class="icon icon--copy" aria-hidden="true"></span>
        </button>

        <button
          data-tooltip
          type="button"
          id="wrap"
          aria-pressed="false"
          aria-label="Toggle word wrap"
          data-i18n-aria-label="properties_toggleWordWrap"
        >
          <span class="icon icon--text-wrap" aria-hidden="true"></span>
        </button>

        <button
          data-tooltip
          type="button"
          id="version-toggle"
          aria-pressed="true"
          aria-label="Online version"
          data-i18n-aria-label="properties_onlineVersion"
        >
          <span class="icon icon--globe2" aria-hidden="true"></span>
        </button>
      </div>
      <div class="request-address">
        <a id="request-url" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>
    <div id="error"></div>
    <div id="spinner" class="bar hidden"></div>
    <div id="json-wrapper" class="json-holder">
      <pre></pre>
    </div>
    <button
      data-tooltip
      type="button"
      id="json-id-copy-template"
      class="json-id-copy"
      aria-label="Copy node ID"
      data-i18n-aria-label="common_copyNodeId"
    >
      <span class="icon icon--copy" aria-hidden="true"></span>
    </button>
    <script type="module" src="properties.js"></script>
  </body>
</html>
